<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살까말까 상품 모음</title>
<style>
  :root { --bg:#F4FBF7; --card:#fff; --ink:#2E3B36; --sub:#5E7069; --accent:#FF8C7A; --bag:#FFD66B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Malgun Gothic",sans-serif; }
  header { padding:28px 16px 12px; text-align:center; }
  h1 { margin:0; font-size:28px; } h1 b { color:var(--accent); }
  .disclosure { margin:10px auto 0; max-width:560px; font-size:12px; color:var(--sub); }
  .search { display:block; margin:16px auto 0; width:min(560px,100%); padding:12px 14px; font-size:16px;
            border:2px solid var(--bag); border-radius:12px; }
  main { max-width:560px; margin:0 auto; padding:8px 16px 40px; }
  .item { display:flex; gap:12px; align-items:center; background:var(--card); border-radius:16px;
          padding:12px; margin-top:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); scroll-margin-top:16px; }
  .item:target { outline:3px solid var(--accent); }
  .no { flex:none; width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff;
        font-weight:700; display:grid; place-items:center; }
  .item img { flex:none; width:84px; height:84px; object-fit:contain; border-radius:10px; background:#fff; }
  .info { flex:1; min-width:0; }
  .name { font-size:14px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .price { margin-top:4px; font-weight:700; }
  .buy { display:inline-block; margin-top:8px; padding:8px 14px; border-radius:999px; background:var(--bag);
         color:var(--ink); font-weight:700; font-size:14px; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>살까<b>말까</b> 상품 모음</h1>
  <p class="disclosure">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  <input class="search" type="search" inputmode="numeric" placeholder="영상 속 번호를 입력하세요 (예: 3)"
         onkeydown="if(event.key==='Enter'){location.hash=this.value.trim()}">
</header>
<main>
<article class="item" id="3">
  <div class="no">3</div>
  <img src="img/003.jpg" alt="" loading="lazy">
  <div class="info">
    <div class="name">Vtech 옷수선 매직테이프 12mm x 40m 2p, 2개</div>
    <div class="price">8,000원</div>
    <a class="buy" href="https://link.coupang.com/a/hVza5cMAEe" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
  </div>
</article>
<article class="item" id="2">
  <div class="no">2</div>
  <img src="img/002.jpg" alt="" loading="lazy">
  <div class="info">
    <div class="name">바스존 막힘형 고급 욕실화, 블루, 3개</div>
    <div class="price">15,690원</div>
    <a class="buy" href="https://link.coupang.com/a/hVxTveaW1k" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
  </div>
</article>
<article class="item" id="1">
  <div class="no">1</div>
  <img src="img/001.jpg" alt="" loading="lazy">
  <div class="info">
    <div class="name">홈앤미 초강력 사선컷팅 돌돌이 테이프 클리너 롱핸들+리필 4개+케이스, 1세트</div>
    <div class="price">11,900원</div>
    <a class="buy" href="https://link.coupang.com/a/hVtZGp9dts" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
  </div>
</article>
</main>
</body>
</html>
